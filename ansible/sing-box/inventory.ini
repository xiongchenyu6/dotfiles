# sg-office 不在这里 —— 它的 sing-box 已经交给 NixOS 管
# (autolife/nixos 的 nixos-configurations/sg-office/default.nix,
#  services.sing-box + sops 密钥 + 自签证书)。
# 把它放回这个组会让本 playbook 往 /etc/systemd/system/ 装一个单元,
# 而那个单元优先级高于 NixOS 生成的,会静默架空整份 NixOS 配置 ——
# rebuild 看着成功,跑的却是 ansible 那份旧配置。
[singbox_servers]
lubancat ansible_host=203.116.95.146 ansible_user=cat
# jtti-sg:备用出海节点,服务端常驻但客户端默认不用它。
# 它到腾讯HK 只有 47ms(Oracle 是 232ms),但自己到 OpenAI 的上行只有
# ~250 KB/s(Oracle 是 4.2 MB/s)。sub2api 传的是 1.2MB 级的 prompt,
# 带宽压倒延迟 —— 让它进 urltest 池会因延迟最低被选中,把上传从 0.3s
# 拖到 4.8s。所以只部署、不启用,留作 Oracle 全挂时的后路。
jtti-sg ansible_host=45.194.18.75 ansible_user=root

# 45.194.18.75 曾以 ubuntu-server 之名挂在这里,现已作为 jtti-sg 正式纳管。
[singbox_legacy]
