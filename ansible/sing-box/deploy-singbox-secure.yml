---
- name: Deploy sing-box with the encrypted Shadowsocks configuration
  hosts: singbox_servers
  gather_facts: false
  become: true

  vars:
    sing_box_version: "1.13.14"
    sing_box_binary_path: /usr/local/bin/sing-box
    sing_box_config_path: /etc/sing-box/config.json
    sing_box_unit_path: /etc/systemd/system/sing-box.service
    sing_box_arch_map:
      x86_64: amd64
      aarch64: arm64
    sing_box_sha256_map:
      amd64: f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697
      arm64: 4742df6a4314e8ecc41736849fca6d73b8f9e91b6e8b06ee794ff17ba180579e
    ansible_python_interpreter: auto_silent

  pre_tasks:
    # sudo 密码按主机名查。以 root 登录的主机(jtti-sg)提权不需要密码,
    # 给它别人的密码反而会让 become 失败,所以查不到就整个跳过设置 ——
    # 注意不能用 omit:那会让 set_fact 一个键都不剩,ansible 直接报
    # "No key/value pairs provided"。
    - name: Load this host's entry from the encrypted secrets
      ansible.builtin.set_fact:
        sing_box_host_secrets: >-
          {{
            (lookup(
              'community.sops.sops',
              playbook_dir + '/../../secrets/common.yaml'
            ) | from_yaml).get(inventory_hostname, {})
          }}
      become: false
      no_log: true

    - name: Use a sudo password only on hosts that need one
      ansible.builtin.set_fact:
        ansible_become_password: "{{ sing_box_host_secrets.become_password }}"
      when: sing_box_host_secrets.become_password is defined
      become: false
      no_log: true

    - name: Define the hysteria2 TLS material paths
      ansible.builtin.set_fact:
        sing_box_tls_dir: /etc/sing-box/tls
        sing_box_tls_cert: /etc/sing-box/tls/hysteria2.crt
        sing_box_tls_key: /etc/sing-box/tls/hysteria2.key
        # 证书由 lego 经 Cloudflare DNS-01 签发的 *.panda.qzz.io 通配证书,
        # 覆盖客户端用的 hy2-<host>.panda.qzz.io SNI —— 客户端无需 insecure。
        # DNS-01 不占 80/443,和机器上其他 web 服务不冲突。
        acme_domain: "*.panda.qzz.io"
        acme_email: xiongchenyu6@gmail.com
        lego_dir: /etc/sing-box/lego
        lego_bin: /usr/local/bin/lego
        lego_version: "4.21.0"

    - name: Gather target facts after privilege setup
      ansible.builtin.setup:

    - name: Load the encrypted hysteria2 settings
      ansible.builtin.set_fact:
        hysteria2_password: "{{ sing_box_secrets.hysteria2.password }}"
        hysteria2_port: "{{ sing_box_secrets.hysteria2.port | int }}"
        cloudflare_dns_api_token: "{{ sing_box_secrets.cloudflare.dns_api_token }}"
      vars:
        sing_box_secrets: >-
          {{
            lookup(
              'community.sops.sops',
              playbook_dir + '/secrets/servers.yaml'
            ) | from_yaml
          }}
      no_log: true

    - name: Validate target architecture and encrypted settings
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] in sing_box_arch_map
          - hysteria2_password | length > 0
          - hysteria2_port | int >= 1
          - hysteria2_port | int <= 65535
        fail_msg: Target architecture or encrypted sing-box settings are invalid
      no_log: true

    - name: Select the release archive for this target
      ansible.builtin.set_fact:
        sing_box_arch: "{{ sing_box_arch_map[ansible_facts['architecture']] }}"
        sing_box_backup_dir: >-
          /var/backups/sing-box-ansible/{{ ansible_facts['date_time']['iso8601_basic_short'] }}

  tasks:
    - name: Install archive prerequisites on Debian-family hosts
      ansible.builtin.apt:
        name:
          - ca-certificates
          - tar
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == 'Debian'

    - name: Create the sing-box service group
      ansible.builtin.group:
        name: sing-box
        system: true

    - name: Create the sing-box service account
      ansible.builtin.user:
        name: sing-box
        group: sing-box
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/sing-box
        create_home: true

    - name: Create root-owned program and configuration directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /usr/local, group: root, mode: '0755' }
        - { path: /usr/local/bin, group: root, mode: '0755' }
        - { path: /etc/sing-box, group: sing-box, mode: '0750' }

    - name: Create the sing-box state directory
      ansible.builtin.file:
        path: /var/lib/sing-box
        state: directory
        owner: sing-box
        group: sing-box
        mode: '0750'


    - name: Record pre-deployment files
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ sing_box_binary_path }}"
        - "{{ sing_box_config_path }}"
        - "{{ sing_box_unit_path }}"
      register: sing_box_previous_files
      no_log: true

    - name: Record pre-deployment service state
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - sing-box.service
          - --property=LoadState
          - --property=ActiveState
          - --property=UnitFileState
      register: sing_box_previous_service
      changed_when: false
      failed_when: false


    - name: Create rollback directory when an installation already exists
      ansible.builtin.file:
        path: "{{ sing_box_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: sing_box_previous_files.results | selectattr('stat.exists') | list | length > 0

    - name: Back up existing sing-box files
      ansible.builtin.copy:
        src: "{{ item.item }}"
        dest: "{{ sing_box_backup_dir }}/{{ item.item | basename }}"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      loop: "{{ sing_box_previous_files.results }}"
      when: item.stat.exists
      no_log: true

    - name: Check the installed sing-box version
      ansible.builtin.command:
        argv:
          - "{{ sing_box_binary_path }}"
          - version
      register: sing_box_version_before
      changed_when: false
      failed_when: false

    - name: Decide whether the binary must be installed
      ansible.builtin.set_fact:
        sing_box_needs_install: >-
          {{
            sing_box_version_before.rc != 0
            or sing_box_version not in sing_box_version_before.stdout
          }}

    - name: Install and activate sing-box
      block:
        - name: Download the architecture-specific official release
          ansible.builtin.get_url:
            url: >-
              https://github.com/SagerNet/sing-box/releases/download/v{{ sing_box_version }}/sing-box-{{ sing_box_version }}-linux-{{ sing_box_arch }}.tar.gz
            dest: >-
              /tmp/sing-box-{{ sing_box_version }}-linux-{{ sing_box_arch }}.tar.gz
            checksum: "sha256:{{ sing_box_sha256_map[sing_box_arch] }}"
            owner: root
            group: root
            mode: '0644'
          when: sing_box_needs_install

        - name: Extract the verified sing-box release
          ansible.builtin.unarchive:
            src: >-
              /tmp/sing-box-{{ sing_box_version }}-linux-{{ sing_box_arch }}.tar.gz
            dest: /tmp
            remote_src: true
          when: sing_box_needs_install

        - name: Install the sing-box binary
          ansible.builtin.copy:
            src: >-
              /tmp/sing-box-{{ sing_box_version }}-linux-{{ sing_box_arch }}/sing-box
            dest: "{{ sing_box_binary_path }}"
            remote_src: true
            owner: root
            group: root
            mode: '0755'
          register: sing_box_binary_install
          when: sing_box_needs_install

        - name: Verify the installed binary and version
          ansible.builtin.command:
            argv:
              - "{{ sing_box_binary_path }}"
              - version
          register: sing_box_version_after
          changed_when: false
          failed_when: >-
            sing_box_version_after.rc != 0
            or sing_box_version not in sing_box_version_after.stdout

        # hysteria2 需要 TLS。用 lego 经 Cloudflare DNS-01 签发 *.panda.qzz.io
        # 的正式证书(Let's Encrypt),客户端因此不必再配 insecure。DNS-01 不
        # 碰 80/443,和机器上其他 web 服务(如 Caddy)不打架。续期由 systemd
        # timer 每天跑 lego renew,只在实际续期时通过 hook 重装证书并重启服务。
        - name: Create the sing-box TLS directory
          ansible.builtin.file:
            path: "{{ sing_box_tls_dir }}"
            state: directory
            owner: root
            group: sing-box
            mode: '0750'

        - name: Detect CPU architecture for the lego download
          ansible.builtin.set_fact:
            lego_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

        - name: Install the lego ACME client
          ansible.builtin.unarchive:
            src: "https://github.com/go-acme/lego/releases/download/v{{ lego_version }}/lego_v{{ lego_version }}_linux_{{ lego_arch }}.tar.gz"
            dest: /usr/local/bin
            include: [lego]
            remote_src: true
            creates: "{{ lego_bin }}"
            mode: '0755'

        - name: Write the Cloudflare credentials for lego
          ansible.builtin.copy:
            content: "CF_DNS_API_TOKEN={{ cloudflare_dns_api_token }}\n"
            dest: /etc/sing-box/lego.env
            owner: root
            group: root
            mode: '0600'
          no_log: true

        # 续期/首签时由 lego 的 hook 调用:把签好的证书装到 sing-box 路径并
        # try-restart(服务没起时是空操作,避免首签阶段误重启半配好的服务)。
        - name: Install the lego cert-install hook
          ansible.builtin.copy:
            dest: /etc/sing-box/lego-install.sh
            owner: root
            group: root
            mode: '0700'
            content: |
              #!/usr/bin/env bash
              set -euo pipefail
              install -m 0640 -g sing-box '{{ lego_dir }}/certificates/_.panda.qzz.io.crt' '{{ sing_box_tls_cert }}'
              install -m 0640 -g sing-box '{{ lego_dir }}/certificates/_.panda.qzz.io.key' '{{ sing_box_tls_key }}'
              systemctl try-restart sing-box || true

        - name: Install the lego issue/renew driver
          ansible.builtin.copy:
            dest: /etc/sing-box/lego-renew.sh
            owner: root
            group: root
            mode: '0700'
            content: |
              #!/usr/bin/env bash
              # 由 ansible 生成。首次 run、之后 renew(未到窗口自动跳过);
              # 只有实际签发/续期才触发 lego-install.sh。
              set -euo pipefail
              set -a; . /etc/sing-box/lego.env; set +a
              common=(--accept-tos --email '{{ acme_email }}' --dns cloudflare
                      --domains '{{ acme_domain }}' --path '{{ lego_dir }}')
              if [ -f '{{ lego_dir }}/certificates/_.panda.qzz.io.crt' ]; then
                '{{ lego_bin }}' "${common[@]}" renew --days 30 --renew-hook /etc/sing-box/lego-install.sh
              else
                '{{ lego_bin }}' "${common[@]}" run --run-hook /etc/sing-box/lego-install.sh
              fi

        - name: Install the cert-renewal systemd service
          ansible.builtin.copy:
            dest: /etc/systemd/system/sing-box-cert.service
            mode: '0644'
            content: |
              [Unit]
              Description=Renew sing-box hysteria2 TLS cert via lego (Cloudflare DNS-01)
              After=network-online.target
              Wants=network-online.target
              [Service]
              Type=oneshot
              ExecStart=/etc/sing-box/lego-renew.sh

        - name: Install the cert-renewal systemd timer
          ansible.builtin.copy:
            dest: /etc/systemd/system/sing-box-cert.timer
            mode: '0644'
            content: |
              [Unit]
              Description=Daily sing-box TLS cert renewal
              [Timer]
              OnCalendar=daily
              RandomizedDelaySec=6h
              Persistent=true
              [Install]
              WantedBy=timers.target

        - name: Enable the cert-renewal timer
          ansible.builtin.systemd_service:
            name: sing-box-cert.timer
            enabled: true
            state: started
            daemon_reload: true

        # 首签同步完成,证书就位后下面的 sing-box 才能带 TLS 起来。creates 用
        # lego 自己的输出而非 sing_box_tls_cert —— 后者可能还是上一轮的自签证书,
        # 那样会误判"已签"而跳过,把自签证书留下。
        - name: Issue the certificate now if lego has not signed one yet
          ansible.builtin.command: /etc/sing-box/lego-renew.sh
          args:
            creates: "{{ lego_dir }}/certificates/_.panda.qzz.io.crt"

        - name: Install the validated sing-box configuration
          ansible.builtin.copy:
            content: |
              {
                "log": {
                  "level": "info",
                  "timestamp": true
                },
                "inbounds": [
                  {
                    "type": "hysteria2",
                    "tag": "hysteria2-in",
                    "listen": "::",
                    "listen_port": {{ hysteria2_port | int }},
                    "users": [
                      { "password": {{ hysteria2_password | to_json }} }
                    ],
                    "tls": {
                      "enabled": true,
                      "certificate_path": "{{ sing_box_tls_cert }}",
                      "key_path": "{{ sing_box_tls_key }}"
                    }
                  }
                ],
                "outbounds": [
                  {
                    "type": "direct",
                    "tag": "direct"
                  }
                ]
              }
            dest: "{{ sing_box_config_path }}"
            owner: root
            group: sing-box
            mode: '0640'
            validate: "{{ sing_box_binary_path }} check -c %s"
          register: sing_box_config_install
          no_log: true

        - name: Install the hardened systemd unit
          ansible.builtin.copy:
            content: |
              [Unit]
              Description=sing-box service
              Documentation=https://sing-box.sagernet.org
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              User=sing-box
              Group=sing-box
              WorkingDirectory=/var/lib/sing-box
              ExecStartPre={{ sing_box_binary_path }} check -c {{ sing_box_config_path }}
              ExecStart={{ sing_box_binary_path }} run -c {{ sing_box_config_path }}
              Restart=on-failure
              RestartSec=10
              LimitNOFILE=65536
              NoNewPrivileges=true
              PrivateDevices=true
              PrivateTmp=true
              ProtectHome=true
              ProtectSystem=strict
              ReadOnlyPaths=/etc/sing-box
              ReadWritePaths=/var/lib/sing-box
              RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
              RestrictRealtime=true
              SystemCallArchitectures=native
              {% if hysteria2_port | int < 1024 %}
              AmbientCapabilities=CAP_NET_BIND_SERVICE
              CapabilityBoundingSet=CAP_NET_BIND_SERVICE
              {% else %}
              CapabilityBoundingSet=
              {% endif %}

              [Install]
              WantedBy=multi-user.target
            dest: "{{ sing_box_unit_path }}"
            owner: root
            group: root
            mode: '0644'
          register: sing_box_unit_install
          no_log: true

        # 不改成 handler:本 playbook 用 block/rescue 做回滚,而 handler 只在
        # play 末尾统一触发 —— 回滚路径上它可能根本不执行,或在错误的时刻执行。
        - name: Reload systemd when the unit changed # noqa: no-handler
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: sing_box_unit_install.changed

        - name: Enable and activate sing-box on standard systemd hosts
          ansible.builtin.systemd_service:
            name: sing-box.service
            enabled: true
            state: >-
              {{
                'restarted'
                if (
                  (sing_box_binary_install.changed | default(false))
                  or sing_box_config_install.changed
                  or sing_box_unit_install.changed
                )
                else 'started'
              }}

        - name: Validate the live configuration
          ansible.builtin.command:
            argv:
              - "{{ sing_box_binary_path }}"
              - check
              - -c
              - "{{ sing_box_config_path }}"
          changed_when: false
          no_log: true

        - name: Verify that sing-box is active
          ansible.builtin.command:
            argv:
              - systemctl
              - is-active
              - sing-box.service
          register: sing_box_active
          changed_when: false
          until: sing_box_active.stdout | trim == 'active'
          retries: 10
          delay: 1

        # A listener on ::1 only proves the process is up. Both nodes spent a
        # long time with service active and socket bound while every inbound
        # packet was dropped at the border — indistinguishable from "the node
        # is down" to a client. This playbook otherwise leaves firewall and
        # routing alone, so the one port it needs is opened here by ufw.
        # hysteria2 是 UDP/QUIC。漏了这条的话服务端一切正常(端口在监听、
        # 证书就位、日志无错),但客户端一个包都进不来 —— 排查时正是这样:
        # 从腾讯 HK 打过来 0/10,而本机 ss -lun 显示 8443 好好地听着。
        - name: Open the hysteria2 port in ufw
          community.general.ufw:
            rule: allow
            port: "{{ hysteria2_port }}"
            proto: udp
            comment: hysteria2 egress for sub2api

      rescue:
        - name: Stop a newly introduced sing-box unit
          ansible.builtin.systemd_service:
            name: sing-box.service
            state: stopped
            enabled: false
          when: "'LoadState=not-found' in sing_box_previous_service.stdout"
          failed_when: false


        - name: Restore files that existed before deployment
          ansible.builtin.copy:
            src: "{{ sing_box_backup_dir }}/{{ item.item | basename }}"
            dest: "{{ item.item }}"
            remote_src: true
            owner: root
            group: "{{ 'sing-box' if item.item == sing_box_config_path else 'root' }}"
            mode: "{{ '0640' if item.item == sing_box_config_path else ('0755' if item.item == sing_box_binary_path else '0644') }}"
          loop: "{{ sing_box_previous_files.results }}"
          when: item.stat.exists
          no_log: true

        - name: Remove files introduced by the failed deployment
          ansible.builtin.file:
            path: "{{ item.item }}"
            state: absent
          loop: "{{ sing_box_previous_files.results }}"
          when: not item.stat.exists
          no_log: true

        - name: Reload systemd after rollback
          ansible.builtin.systemd_service:
            daemon_reload: true
          failed_when: false

        - name: Restore the previous service state
          ansible.builtin.systemd_service:
            name: sing-box.service
            enabled: "{{ 'UnitFileState=enabled' in sing_box_previous_service.stdout }}"
            state: >-
              {{
                'started'
                if 'ActiveState=active' in sing_box_previous_service.stdout
                else 'stopped'
              }}
          when: "'LoadState=not-found' not in sing_box_previous_service.stdout"
          failed_when: false

        - name: Stop after rolling back a failed deployment
          ansible.builtin.fail:
            msg: sing-box deployment failed and the previous files/service state were restored

    - name: Report the non-sensitive deployment result
      ansible.builtin.debug:
        msg: >-
          sing-box {{ sing_box_version }} is active on {{ inventory_hostname }}
          ({{ ansible_facts['distribution'] }} {{ ansible_facts['architecture'] }});
          firewall and routing were unchanged.
