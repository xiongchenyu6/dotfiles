---
# Deploy Tuwunel, a Matrix homeserver, behind the host nginx on lubancat.
# Auth0 is the identity provider; see README.md for the app registration.
- name: Deploy Tuwunel Matrix homeserver
  hosts: tuwunel_servers
  become: yes
  # Facts would be gathered before the sudo password is loaded from sops, and
  # nothing here needs them.
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Load host secrets from the repository sops store
      ansible.builtin.set_fact:
        tuwunel_common_secrets: >-
          {{
            lookup(
              'community.sops.sops',
              playbook_dir + '/../../secrets/common.yaml'
            ) | from_yaml
          }}
      become: false
      no_log: true

    - name: Use a sudo password on hosts that need one
      ansible.builtin.set_fact:
        ansible_become_password: "{{ tuwunel_common_secrets[inventory_hostname].become_password }}"
      when: tuwunel_common_secrets[inventory_hostname].become_password is defined
      become: false
      no_log: true

    - name: Resolve the Auth0 identity provider settings
      ansible.builtin.set_fact:
        tuwunel_auth0_domain: "{{ tuwunel_common_secrets.auth0.domain | default('') }}"
        tuwunel_oidc_client_id: "{{ tuwunel_common_secrets.auth0.tuwunel.client_id | default('') }}"
        tuwunel_oidc_client_secret: "{{ tuwunel_common_secrets.auth0.tuwunel.client_secret | default('') }}"
      no_log: true

    - name: Warn when the Auth0 application has not been registered yet
      ansible.builtin.debug:
        msg: >-
          auth0.tuwunel.client_id is missing from secrets/common.yaml — deploying
          without SSO. Run scripts/auth0-setup.sh, then re-run this playbook.
      when: tuwunel_oidc_client_id | length == 0

    - name: Install required packages
      ansible.builtin.apt:
        name: [curl, docker.io, docker-compose-v2, nginx]
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create the deployment and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ tuwunel_deploy_dir }}"
        - "{{ tuwunel_deploy_dir }}/data"

    # The registration token is generated once and kept, so re-running the
    # playbook never invalidates a token a user was handed.
    - name: Check for previously persisted secrets
      ansible.builtin.stat:
        path: "{{ tuwunel_deploy_dir }}/.secrets.yml"
      register: tuwunel_secrets_stat

    - name: Load previously persisted secrets
      ansible.builtin.slurp:
        src: "{{ tuwunel_deploy_dir }}/.secrets.yml"
      register: tuwunel_secrets_blob
      when: tuwunel_secrets_stat.stat.exists
      no_log: true

    - name: Parse persisted secrets into facts
      ansible.builtin.set_fact:
        tuwunel_persisted: "{{ tuwunel_secrets_blob.content | b64decode | from_yaml }}"
      when: tuwunel_secrets_stat.stat.exists
      no_log: true

    - name: Resolve the registration token
      ansible.builtin.set_fact:
        tuwunel_registration_token: "{{ tuwunel_registration_token
          | default(tuwunel_persisted.tuwunel_registration_token
                    | default(lookup('ansible.builtin.pipe', 'openssl rand -hex 24'))) }}"
      no_log: true

    - name: Persist secrets to {{ tuwunel_deploy_dir }}/.secrets.yml
      ansible.builtin.copy:
        content: |
          ---
          tuwunel_registration_token: "{{ tuwunel_registration_token }}"
        dest: "{{ tuwunel_deploy_dir }}/.secrets.yml"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Deploy tuwunel.toml
      ansible.builtin.template:
        src: templates/tuwunel.toml.j2
        dest: "{{ tuwunel_deploy_dir }}/tuwunel.toml"
        owner: root
        group: root
        mode: '0600'
      notify: restart tuwunel

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ tuwunel_deploy_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'
      notify: restart tuwunel

    - name: Pull the image (best-effort; tolerates registry flakiness)
      ansible.builtin.command: docker compose pull --ignore-pull-failures
      args:
        chdir: "{{ tuwunel_deploy_dir }}"
      register: tuwunel_pull
      changed_when: "'Pull complete' in tuwunel_pull.stdout or 'Downloaded' in tuwunel_pull.stdout"
      failed_when: false

    - name: Start the stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ tuwunel_deploy_dir }}"
      register: tuwunel_up
      changed_when: "'Started' in tuwunel_up.stderr or 'Created' in tuwunel_up.stderr"

    - name: Ensure the TLS cert is in place
      ansible.builtin.stat:
        path: "{{ tuwunel_ssl_cert }}"
      register: tuwunel_cert_stat

    - name: Fail if the TLS cert is missing
      ansible.builtin.fail:
        msg: "TLS cert not found at {{ tuwunel_ssl_cert }}. Issue it via acme.sh first (see README)."
      when: not tuwunel_cert_stat.stat.exists

    - name: Deploy the nginx vhost
      ansible.builtin.template:
        src: templates/nginx-tuwunel.conf.j2
        dest: /etc/nginx/sites-available/tuwunel
        owner: root
        group: root
        mode: '0644'
      notify: reload nginx

    - name: Enable the nginx vhost
      ansible.builtin.file:
        src: /etc/nginx/sites-available/tuwunel
        dest: /etc/nginx/sites-enabled/tuwunel
        state: link
      notify: reload nginx

    - name: Validate the nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Flush handlers so the health check sees the final state
      ansible.builtin.meta: flush_handlers

    - name: Wait for the Client-Server API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ tuwunel_port }}/_matrix/client/versions"
        status_code: 200
      register: tuwunel_health
      retries: 24
      delay: 5
      until: tuwunel_health.status == 200
      ignore_errors: yes

    - name: Report deployment status
      ansible.builtin.debug:
        msg: |
          ========================================
          Tuwunel: {{ 'SUCCESS' if tuwunel_health.status | default(0) == 200 else 'STARTING/FAILED' }}
          ========================================
          Deploy dir:  {{ tuwunel_deploy_dir }}
          Homeserver:  https://{{ tuwunel_host_name }}
          server_name: {{ tuwunel_server_name }}  (MXIDs are @user:{{ tuwunel_server_name }},
                       delegated from the apex to the homeserver above)
          SSO:         {{ 'Auth0 (' + tuwunel_auth0_domain + ')' if tuwunel_oidc_client_id | length > 0 else 'NOT CONFIGURED' }}
          Secrets:     {{ tuwunel_deploy_dir }}/.secrets.yml (mode 0600)
          Admin:       docker exec -it tuwunel tuwunel-admin  (see README)
          ========================================

  handlers:
    - name: restart tuwunel
      ansible.builtin.command: docker compose restart
      args:
        chdir: "{{ tuwunel_deploy_dir }}"

    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
