---
# Deploy ntfy behind the host nginx on lubancat.
# ntfy authenticates against its own user database and per-topic ACLs; it has
# no OIDC support, so unlike the rest of the stack it does not use Auth0.
# See README.md.
- name: Deploy ntfy
  hosts: ntfy_servers
  become: yes
  # Facts would be gathered before the sudo password is loaded from sops, and
  # nothing here needs them.
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Load host secrets from the repository sops store
      ansible.builtin.set_fact:
        ntfy_common_secrets: >-
          {{
            lookup(
              'community.sops.sops',
              playbook_dir + '/../../secrets/common.yaml'
            ) | from_yaml
          }}
      become: false
      no_log: true

    - name: Use a sudo password on hosts that need one
      ansible.builtin.set_fact:
        ansible_become_password: "{{ ntfy_common_secrets[inventory_hostname].become_password }}"
      when: ntfy_common_secrets[inventory_hostname].become_password is defined
      become: false
      no_log: true

    - name: Load the provisioned ntfy roster from the sops store
      ansible.builtin.set_fact:
        ntfy_provisioned_users: "{{ ntfy_common_secrets.ntfy.users | default([]) }}"
      no_log: true

    - name: Warn when no roster is provisioned
      ansible.builtin.debug:
        msg: >-
          ntfy.users is empty in secrets/common.yaml — deploying with nobody
          able to log in. Add people with scripts/ntfy-user.sh.
      when: ntfy_provisioned_users | length == 0

    - name: Install required packages
      ansible.builtin.apt:
        name: [curl, docker.io, docker-compose-v2, nginx]
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create the deployment and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ ntfy_deploy_dir }}"
        - "{{ ntfy_deploy_dir }}/data"

    - name: Deploy server.yml
      ansible.builtin.template:
        src: templates/server.yml.j2
        dest: "{{ ntfy_deploy_dir }}/server.yml"
        owner: root
        group: root
        mode: '0644'
      notify: restart ntfy

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ ntfy_deploy_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: '0600'
      notify: restart ntfy

    - name: Pull images (best-effort; tolerates registry flakiness)
      ansible.builtin.command: docker compose pull --ignore-pull-failures
      args:
        chdir: "{{ ntfy_deploy_dir }}"
      register: ntfy_pull
      changed_when: "'Pull complete' in ntfy_pull.stdout or 'Downloaded' in ntfy_pull.stdout"
      failed_when: false

    - name: Start the stack
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ ntfy_deploy_dir }}"
      register: ntfy_up
      changed_when: "'Started' in ntfy_up.stderr or 'Created' in ntfy_up.stderr"

    - name: Wait for ntfy to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ntfy_port }}/v1/health"
        status_code: 200
      register: ntfy_health
      retries: 24
      delay: 5
      until: ntfy_health.status == 200
      ignore_errors: yes

    - name: Ensure the TLS cert is in place
      ansible.builtin.stat:
        path: "{{ ntfy_ssl_cert }}"
      register: ntfy_cert_stat

    - name: Fail if the TLS cert is missing
      ansible.builtin.fail:
        msg: "TLS cert not found at {{ ntfy_ssl_cert }}. Issue it via acme.sh first (see README)."
      when: not ntfy_cert_stat.stat.exists

    - name: Deploy the nginx vhost
      ansible.builtin.template:
        src: templates/nginx-ntfy.conf.j2
        dest: /etc/nginx/sites-available/ntfy
        owner: root
        group: root
        mode: '0644'
      notify: reload nginx

    - name: Enable the nginx vhost
      ansible.builtin.file:
        src: /etc/nginx/sites-available/ntfy
        dest: /etc/nginx/sites-enabled/ntfy
        state: link
      notify: reload nginx

    - name: Validate the nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Report deployment status
      ansible.builtin.debug:
        msg: |
          ========================================
          ntfy: {{ 'SUCCESS' if ntfy_health.status | default(0) == 200 else 'STARTING/FAILED' }}
          ========================================
          Deploy dir: {{ ntfy_deploy_dir }}
          Public URL: https://{{ ntfy_domain }}
          Auth:       ntfy's own users and tokens (no Auth0 — see README)
          Roster:     {{ ntfy_provisioned_users | length }} provisioned user(s), from secrets/common.yaml
          ========================================
          Add or change people with scripts/ntfy-user.sh, then re-run this
          playbook. Nothing is typed into the auth database by hand.
          ========================================

  handlers:
    # server.yml is a bind mount that ntfy reads only at startup, and
    # `up -d` alone leaves the container running when only that file changed.
    - name: restart ntfy
      ansible.builtin.command: docker compose up -d --remove-orphans --force-recreate
      args:
        chdir: "{{ ntfy_deploy_dir }}"

    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
