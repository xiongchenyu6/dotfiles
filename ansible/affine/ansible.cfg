[defaults]
# lubancat is an SBC running a dozen containers; the default occasionally
# times out waiting for sudo to print its prompt.
timeout = 30
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 86400

[inventory]
enable_plugins = host_list, yaml, ini, auto

[ssh_connection]
pipelining = True
